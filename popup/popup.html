<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Foco</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup" data-state="loading">
    <header class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Foco</span>
    </header>

    <button id="toggle" class="power" type="button" role="switch" aria-checked="false" aria-label="Ligar foco">
      <svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true">
        <path d="M12 3v8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M6.3 6.8a8 8 0 1 0 11.4 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </button>

    <p id="status" class="status">Foco desligado</p>
    <p id="hint" class="hint">Toque para ligar</p>

    <footer class="sites">
      <span>YouTube Shorts</span>
      <span>Instagram</span>
      <span>TikTok</span>
      <span>Facebook Reels</span>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
